name: TV UI verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  emulator:
    name: Android TV emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TV-APKs
          path: tv-apks
      - name: Enable emulator acceleration
        run: bash .github/scripts/enable-emulator-acceleration.sh
      - name: Check Flutter TV UI and Android operations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-tv-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-UI-review-${{ github.run_attempt }}
          path: tv-results/
