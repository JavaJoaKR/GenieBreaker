name: TV UI verification
on:
  push:
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - '.github/workflows/tv-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check TV layout and late name focus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/genie-tv-ui.png tv-ui.png
            adb pull /sdcard/Download/genie-app-ui.png app-ui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-UI-review-${{ github.run_attempt }}
          path: |
            tv-ui.png
            app-ui.png
            app/build/reports/androidTests/connected/debug/
