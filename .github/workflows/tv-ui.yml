name: TV UI verification
on:
  push:
    paths:
      - 'app/src/**'
      - 'flutter_ui/**'
      - 'settings.gradle'
      - 'app/build.gradle'
      - '.github/workflows/tv-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Verify and build Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build aar --no-profile --target-platform android-arm,android-x64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Flutter TV UI and Android operations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/genie-tv-ui.png tv-ui.png
            adb pull /sdcard/Download/genie-app-ui.png app-ui.png
            adb pull /sdcard/Download/genie-flutter-menu.png flutter-menu.png
            adb pull /sdcard/Download/genie-files-ui.png files-ui.png
            adb pull /sdcard/Download/genie-file-path-ui.png file-path-ui.png
            adb pull /sdcard/Download/genie-storage-ui.png storage-ui.png
            adb pull /sdcard/Download/genie-shortcuts-ui.png shortcuts-ui.png
            adb pull /sdcard/Download/genie-popup-depth.png popup-depth.png
            adb pull /sdcard/Download/genie-clone-options.png clone-options.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-UI-review-${{ github.run_attempt }}
          path: |
            tv-ui.png
            app-ui.png
            flutter-menu.png
            files-ui.png
            file-path-ui.png
            storage-ui.png
            shortcuts-ui.png
            popup-depth.png
            clone-options.png
            app/build/reports/androidTests/connected/debug/
