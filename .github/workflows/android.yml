name: Build and release APK
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'tv-device-info/**'
      - '.github/workflows/tv-device-info.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[device-info-only]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      ANDROID10_COMPAT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android10-compat]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Verify and build Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
          targets=android-arm,android-x64
          if [[ "$ANDROID10_COMPAT" == true ]]; then
            targets+=,android-arm64
          fi
          flutter build aar --no-profile --target-platform "$targets" --split-debug-info="$GITHUB_WORKSPACE/build-symbols"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare development signing key
        run: base64 --decode development-keystore.base64 > release.jks
      - name: Build and lint
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintRelease || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt 2>/dev/null || true
            exit 1
          }
      - name: Package APKs
        run: |
          mkdir -p dist
          standard="dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$standard"
          if [[ "$ANDROID10_COMPAT" == true ]]; then
            gradle --no-daemon :app:assembleRelease -Pandroid10Compat=true
            cp app/build/outputs/apk/release/app-release.apk dist/GenieBreaker-Android10.apk
            python3 - "$standard" <<'PY'
          from sys import argv
          from zipfile import ZipFile

          for apk, expected in (
              (argv[1], {"armeabi-v7a"}),
              ("dist/GenieBreaker-Android10.apk", {"armeabi-v7a", "arm64-v8a", "x86_64"}),
          ):
              with ZipFile(apk) as archive:
                  libraries = set(archive.namelist())
                  actual = {name.split("/")[1] for name in libraries if name.startswith("lib/") and name.endswith(".so")}
                  assert actual == expected, (apk, actual)
                  for abi in expected:
                      for library in ("libapp.so", "libflutter.so"):
                          assert f"lib/{abi}/{library}" in libraries, (apk, abi, library)
          PY
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' *.apk | tee APK_SIZE.txt
          for apk in *.apk; do
            echo "$apk"
            unzip -l "$apk" | awk '/lib\/.*\.so$/ { print $4, $1 }'
          done | tee NATIVE_LIBS.txt
      - name: Enable Android 10 emulator acceleration
        if: env.ANDROID10_COMPAT == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android 10 compatibility APK
        if: env.ANDROID10_COMPAT == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-android10-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
          path: |
            dist/*
            app/build/reports/lint-results-release.html
            build-symbols/app.android-arm.symbols
      - name: Publish commit release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cp "dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk" dist/GenieBreaker.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          notes="자동 개발 빌드. 공개 개발용 키로 서명되며 MA4000 실기기 검증 전입니다. [channel:${GITHUB_REF_NAME}]"
          if [[ "$ANDROID10_COMPAT" == true ]]; then
            notes+=$'\n\nGenieBreaker-Android10.apk는 Android 10용 임시 호환 빌드입니다. ARM32, ARM64, x86_64를 포함합니다.'
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "GenieBreaker build ${GITHUB_RUN_NUMBER}" --latest --notes "$notes"
