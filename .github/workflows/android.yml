name: Build and release APK
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tv-device-info/**'
      - '.github/workflows/tv-device-info.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tv-device-info/**'
      - '.github/workflows/tv-device-info.yml'
  workflow_dispatch:
    inputs:
      android10_compat:
        description: Build and verify the Android 10 compatibility APK
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_NUMBER: ${{ github.run_number }}
  FLUTTER_VERSION: '3.35.7'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID10_COMPAT: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[android10-compat]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[android10-compat]')) || (github.event_name == 'workflow_dispatch' && inputs.android10_compat) }}
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[device-info-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android10: ${{ steps.package.outputs.android10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Cache Flutter AARs and symbols
        id: flutter-aar
        uses: actions/cache@v4
        with:
          path: |
            flutter_ui/build/host/outputs/repo
            build-symbols
          key: genie-aar-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ env.ANDROID10_COMPAT }}-${{ hashFiles('flutter_ui/lib/**', 'flutter_ui/pubspec.yaml', 'flutter_ui/pubspec.lock') }}
      - name: Build Flutter AARs
        if: steps.flutter-aar.outputs.cache-hit != 'true'
        working-directory: flutter_ui
        run: |
          targets=android-arm,android-x64
          if [[ "$ANDROID10_COMPAT" == true ]]; then targets+=,android-arm64; fi
          flutter build aar --no-profile --target-platform "$targets" --split-debug-info="$GITHUB_WORKSPACE/build-symbols"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android APKs
        env:
          ORG_GRADLE_PROJECT_ciNdkVersion: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          base64 --decode development-keystore.base64 > release.jks
          gradle --build-cache :app:assembleRelease :app:lintRelease -PciAbiSplits=true -Pandroid10Compat="$ANDROID10_COMPAT" || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt 2>/dev/null || true
            exit 1
          }
          gradle --build-cache :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PciTvDebug=true
      - name: Package and check APKs
        id: package
        run: bash .github/scripts/package-ci-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
          path: |
            dist/*
            app/build/reports/lint-results-release.html
            build-symbols/app.android-arm.symbols
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: TV-APKs
          path: tv-apks/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  tv:
    needs: build
    uses: ./.github/workflows/tv-ui.yml

  android10:
    needs: build
    if: needs.build.outputs.android10 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
      - name: Enable emulator acceleration
        run: bash .github/scripts/enable-emulator-acceleration.sh
      - name: Verify Android 10 compatibility APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-android10-release.sh

  publish:
    needs: [build, android10]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.android10.result == 'success' || needs.android10.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cp "dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk" dist/GenieBreaker.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          notes="자동 개발 빌드. 공개 개발용 키로 서명되며 MA4000 실기기 검증 전입니다. [channel:${GITHUB_REF_NAME}]"
          if [[ "$ANDROID10_COMPAT" == true ]]; then
            notes+=$'\n\nGenieBreaker-Android10.apk는 Android 10용 임시 호환 빌드입니다. ARM32, ARM64, x86_64를 포함합니다.'
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "GenieBreaker build ${GITHUB_RUN_NUMBER}" --latest --notes "$notes"
