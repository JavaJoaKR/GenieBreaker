name: Build and release APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Verify and build Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build aar --no-profile --target-platform android-arm,android-x64 --split-debug-info="$GITHUB_WORKSPACE/build-symbols"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare development signing key
        run: base64 --decode development-keystore.base64 > release.jks
      - name: Build and lint
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintRelease || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt 2>/dev/null || true
            exit 1
          }
      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' *.apk | tee APK_SIZE.txt
          unzip -l *.apk | awk '/lib\/.*\.so$/ { print $4, $1 }' | tee NATIVE_LIBS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
          path: |
            dist/*
            app/build/reports/lint-results-release.html
            build-symbols/app.android-arm.symbols
      - name: Publish commit release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cp "dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk" dist/GenieBreaker.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "GenieBreaker build ${GITHUB_RUN_NUMBER}" --latest --notes "자동 개발 빌드. 공개 개발용 키로 서명되며 MA4000 실기기 검증 전입니다. [channel:${GITHUB_REF_NAME}]"
