name: Build and release APK
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_NUMBER: ${{ github.run_number }}
  FLUTTER_VERSION: '3.35.7'
  ANDROID_NDK_VERSION: '27.3.13750724'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Cache Flutter AARs and symbols
        id: flutter-aar
        uses: actions/cache@v4
        with:
          path: |
            flutter_ui/build/host/outputs/repo
            build-symbols
          # Keep the cache key for the existing ARM32 and x64 AARs.
          key: genie-aar-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-false-${{ hashFiles('flutter_ui/lib/**', 'flutter_ui/pubspec.yaml', 'flutter_ui/pubspec.lock') }}
      - name: Build Flutter AARs
        if: steps.flutter-aar.outputs.cache-hit != 'true'
        working-directory: flutter_ui
        run: flutter build aar --no-profile --target-platform android-arm,android-x64 --split-debug-info="$GITHUB_WORKSPACE/build-symbols"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android APKs
        env:
          ORG_GRADLE_PROJECT_ciNdkVersion: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          base64 --decode development-keystore.base64 > release.jks
          gradle --build-cache :app:assembleRelease :app:lintRelease -PciAbiSplits=true || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt 2>/dev/null || true
            exit 1
          }
          gradle --build-cache :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PciTvDebug=true
      - name: Package and check APKs
        run: bash .github/scripts/package-ci-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
          path: |
            dist/*
            app/build/reports/lint-results-release.html
            build-symbols/app.android-arm.symbols
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: TV-APKs
          path: tv-apks/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  tv:
    needs: build
    uses: ./.github/workflows/tv-ui.yml

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GenieBreaker-${{ github.run_number }}
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cp "dist/GenieBreaker-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk" dist/GenieBreaker.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          notes="자동 개발 빌드. 공개 개발용 키로 서명되며 MA4000 실기기 검증 전입니다. [channel:${GITHUB_REF_NAME}]"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "GenieBreaker build ${GITHUB_RUN_NUMBER}" --latest --notes "$notes"
