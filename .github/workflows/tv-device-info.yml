name: Build TV device info APK
on:
  push:
    paths:
      - 'tv-device-info/**'
      - '.github/workflows/tv-device-info.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify standalone APK
        run: |
          base64 --decode development-keystore.base64 > release.jks
          gradle --no-daemon -p tv-device-info :assembleRelease :lintRelease :install-check:assembleRelease :install-check:lintRelease
          mkdir -p dist
          apk=dist/TVDeviceInfo.apk
          cp tv-device-info/build/outputs/apk/release/tv-device-info-release.apk "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" | grep -Fx "sdkVersion:'16'"
          "$tools/apksigner" verify --verbose --min-sdk-version 16 "$apk"
          if unzip -Z1 "$apk" | grep '^lib/'; then
            echo 'The device info APK must be architecture-independent.' >&2
            exit 1
          fi
          if "$tools/aapt" dump permissions "$apk" | grep 'uses-permission'; then
            echo 'The device info APK must not request permissions.' >&2
            exit 1
          fi
          check_apk=dist/GenieBreakerInstallCheck-170.apk
          cp tv-device-info/install-check/build/outputs/apk/release/install-check-release.apk "$check_apk"
          "$tools/apksigner" verify --min-sdk-version 26 "$check_apk"
          stat -c '%n %s bytes' "$apk" "$check_apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TVDeviceInfo
          path: dist/*.apk
      - name: Attach to the current release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq '.tagName')
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for apk in dist/*.apk; do
            if ! grep -Fxq "${apk##*/}" <<< "$assets"; then
              gh release upload "$tag" "$apk"
            fi
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify device information on Android 5.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          arch: x86
          target: default
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install dist/TVDeviceInfo.apk
            adb shell input keyevent 82
            adb shell am start -W -n kr.javajoa.tvdeviceinfo/.DeviceInfoActivity
            adb shell uiautomator dump /data/local/tmp/tv-device-info.xml
            adb pull /data/local/tmp/tv-device-info.xml dist/screen.xml
            grep -Eq 'SDK \(API\)[[:space:]]+22' dist/screen.xml
            grep -Eq 'Android 버전[[:space:]]+5\.1' dist/screen.xml
            grep -Eq '지원 CPU \(ABI\)[[:space:]]+x86' dist/screen.xml
            echo 'Android 5.1 displayed the OS version, SDK, and CPU ABI.'
