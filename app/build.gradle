plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'kr.javajoa.geniebreaker'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.javajoa.geniebreaker'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('BUILD_NUMBER') ?: '1')
    }
    signingConfigs {
        release {
            storeFile rootProject.file('release.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'geniebreaker'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
