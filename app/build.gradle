plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def tvReleaseSmoke = providers.gradleProperty('tvReleaseSmoke').map { it == 'true' }.getOrElse(false)
def android10Compat = providers.gradleProperty('android10Compat').map { it == 'true' }.getOrElse(false)
def ciAbiSplits = providers.gradleProperty('ciAbiSplits').map { it == 'true' }.getOrElse(false)
def ciTvDebug = providers.gradleProperty('ciTvDebug').map { it == 'true' }.getOrElse(false)
def ciNdkVersion = providers.gradleProperty('ciNdkVersion').orNull
def buildCommit = providers.environmentVariable('GITHUB_SHA')
    .orElse(providers.gradleProperty('buildCommit'))
    .orElse(providers.exec {
        workingDir rootProject.projectDir
        commandLine 'git', 'rev-parse', 'HEAD'
        ignoreExitValue = true
    }.standardOutput.asText)
    .get().trim()
if (!(buildCommit ==~ /[0-9a-fA-F]{6,64}/)) {
    throw new GradleException('Build from a Git checkout or supply the source commit with -PbuildCommit.')
}
android {
    namespace 'kr.javajoa.geniebreaker'
    compileSdk 35
    if (ciNdkVersion != null) ndkVersion ciNdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'kr.javajoa.geniebreaker'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        if (!ciAbiSplits) {
            ndk {
                abiFilters 'x86_64'
                if (!ciTvDebug) abiFilters 'armeabi-v7a'
                if (android10Compat) abiFilters 'arm64-v8a'
            }
        }
        targetSdk 35
        buildConfigField 'String', 'BUILD_COMMIT', "\"${buildCommit.substring(0, 6).toLowerCase(Locale.ROOT)}\""
        versionCode Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('BUILD_NUMBER') ?: '1')
    }
    signingConfigs {
        release {
            storeFile rootProject.file('release.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'geniebreaker'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // MA4000 is ARM32. Keep x86_64 only in debug/emulator builds.
            if (!ciAbiSplits) {
                ndk {
                    abiFilters.clear()
                    abiFilters 'armeabi-v7a'
                    if (tvReleaseSmoke || android10Compat) abiFilters 'x86_64'
                    if (android10Compat) abiFilters 'arm64-v8a'
                }
            }
        }
    }
    if (ciAbiSplits) {
        splits {
            abi {
                enable true
                reset()
                include 'armeabi-v7a', 'x86_64'
                if (android10Compat) include 'arm64-v8a'
                universalApk android10Compat
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    debugImplementation 'kr.javajoa.genie_ui:flutter_debug:1.0'
    releaseImplementation 'kr.javajoa.genie_ui:flutter_release:1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'io.github.reandroid:ARSCLib:1.4.0'
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.android.tools.build:apksig:8.9.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        if (ciTvDebug) {
            // Keep the APK workshop fixture below its source-size limit.
            variant.packaging.jniLibs.excludes.addAll(['**/armeabi-v7a/**', '**/arm64-v8a/**'])
        }
    }
    onVariants(selector().withBuildType('release')) { variant ->
        // Keep the normal release ARM32 even when the AAR also contains compatibility targets.
        if (!ciAbiSplits && !android10Compat) variant.packaging.jniLibs.excludes.add('**/arm64-v8a/**')
        if (!ciAbiSplits && !tvReleaseSmoke && !android10Compat) variant.packaging.jniLibs.excludes.add('**/x86_64/**')
    }
}
